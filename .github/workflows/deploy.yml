name: Build, Verify and Deploy to GitHub Pages & Firebase

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  functions-build:
    name: Firebase Cloud Functions Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions Dependencies
        run: npm install

      - name: Compile Cloud Functions TypeScript
        run: npm run build

  frontend-deploy:
    name: Build & Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [functions-build]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular Frontend for GitHub Pages
        run: npx ng build --configuration production --base-href /UM-AI-Based-Budget-Utilization-Monitoring-System/

      - name: Setup 404 SPA fallback
        run: cp dist/ai-budget-monitoring-frontend/browser/index.html dist/ai-budget-monitoring-frontend/browser/404.html

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist/ai-budget-monitoring-frontend/browser

